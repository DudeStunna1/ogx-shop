name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node syntax check
        run: |
          node --check worker.js
          for file in services/*.js tests/*.js; do
            node --check "$file"
          done

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('data/products.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('data/offers.json', 'utf8'));"

      - name: Validate YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('config/shop.yaml').read_text())
          print('shop.yaml is valid')
          PY

      - name: Secret scan
        run: |
          python -m pip install --quiet detect-secrets
          detect-secrets scan --all-files --force-use-all-plugins --exclude-files "package-lock.json|tests/.*\\.test\\.js" > .secrets.baseline
          python - <<'PY'
          import json, sys
          data = json.load(open('.secrets.baseline', 'r', encoding='utf-8'))
          if data.get('results'):
            print('Potential secrets detected:')
            print(json.dumps(data['results'], indent=2))
            sys.exit(1)
          print('No secrets detected')
          PY
